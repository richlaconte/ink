<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pen-ink — React components drawn in pen and ink</title>
  <meta name="description" content="Open-source React components that are drawn for you in real time, in pen and ink. Semantic HTML underneath, an aria-hidden ink layer on top." />
  <meta property="og:title" content="pen-ink" />
  <meta property="og:description" content="React components drawn for you in real time, in pen and ink." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://richlaconte.github.io/ink/" />
  <meta name="theme-color" content="#f3eee2" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- Blank paper until React mounts, so nothing shows before it's drawn. Falls back to showing the page after 3 s. -->
  <script>(function (d) { try { var t = localStorage.getItem('ink-theme'); if (t) d.dataset.inkTheme = t; } catch (e) {} d.classList.add('ink-pending'); setTimeout(function () { d.classList.remove('ink-pending'); }, 3000); })(document.documentElement);</script>
</head>
<body class="ink-paper">
  <div id="root"></div>
  <noscript><p style="padding:24px">pen-ink draws its interface with JavaScript. See the project on <a href="https://github.com/richlaconte/ink">GitHub</a>.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
